[project]
name = "azotea-client"
dynamic = ["version"]
description = "AZOTEA command line interface"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
    {name = "Rafael González", email = "rafael08@ucm.es"},
    {name = "Jaime Zamorano", email ="jzamoran@ucm.es"}
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
  "SQLAlchemy>=2.0",
  "alembic >= 1.20",
  "lica[sqlalchemy]>=3.0", # needs lica library from 2.x on
  "pytz >= 2026.5",
  "rawpy >= 0.27",
  "astropy >= 8.0",
  "validators >= 0.35",
]

[project.scripts]
# Create DB schema and populate with initial values
azoschema = "azotea_cli.cli.schema:main"
# Register images and calculate sky bg statistics
azotea = "azotea_cli.cli.azotea:main"
# provision and reporting utility
azotool = "azotea_cli.cli.azotool:main"
# Preprocess FITS images to be prcessed by azotea
azofits = "azotea_cli.cli.azofits:main"

# ------------------------
# DYNAMIC VERSIONING STUFF
# ------------------------

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/azotea_cli",]

[tool.uv-dynamic-versioning]
fallback-version = "0.1.0"

# -----------
# Other stuff
# -----------

[tool.ruff]
line-length = 100
