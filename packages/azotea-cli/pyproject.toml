[project]
name = "azotea-cli"
version = "0.1.0"
description = "AZOTEA command line interface"
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
    {name = "Rafael González", email = "rafael08@ucm.es"},
    {name = "Jaime Zamorano", email ="jzamoran@ucm.es"}
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
  "SQLAlchemy>=2.0",
  "alembic >= 1.20",
  "lica[sqlalchemy]>=3.0", # needs lica library from 2.x on
  "exifread >= 3.5",
  "rawpy >= 0.27",
  "astropy >= 8.0",
  "tabulate >= 0.10",
  "types-tabulate >= 0.10",
  "lica_cli",
  "lica_tables",
]

[project.scripts]
# Create DB schema and populate with initial values
azoschema = "azotea_cli.infra.cli.schema:main"
# Register images and calculate sky bg statistics
azotea = "azotea_cli.infra.cli.azotea:main"
# provision and reporting utility
azotool = "azotea_cli.infra.cli.azotool:main"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

# -----------
# Other stuff
# -----------

[tool.ruff]
line-length = 100
