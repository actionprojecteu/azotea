# ===============================
# WORKSPACE MASTER PYPROJECT FILE
# ===============================

# Every subproject here may have a separate entry in PyPi
# tagging must be per-project. Example: git tag azotea-cli-0.1.0
[tool.uv.workspace]
members = [
    "packages/azotea-cli",
    "packages/azotea-fits",
]

[tool.uv.sources]
azotea-cli = { workspace = true }
azotea-fits = { workspace = true }
lica-log = { path = "/home/rafa/repos/own/guaix/lica-ng/packages/lica-log" }
lica-cli = { path = "/home/rafa/repos/own/guaix/lica-ng/packages/lica-cli" }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
]
